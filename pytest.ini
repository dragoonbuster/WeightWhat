[tool:pytest]
# Pytest configuration for SizeComparator

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    integration: marks tests as integration tests (require real API keys)
    slow: marks tests as slow (may take several seconds)
    ai_required: marks tests that require AI providers
    performance: marks tests that measure performance
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests

# Test output
addopts = 
    --strict-markers
    --verbose
    --tb=short
    --durations=10
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Minimum version
minversion = 7.0

# Test timeout
timeout = 300

# Async configuration
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

# Test environment
env =
    PYTHONPATH = src
    TESTING = true
    SIZECOMPARATOR_ENV = test
    SIZECOMPARATOR_LOG_LEVEL = INFO