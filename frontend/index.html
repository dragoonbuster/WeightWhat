<!DOCTYPE html>
<html>
<head>
    <title>Weight, What?</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230f0f0f%22/><text x=%2250%22 y=%2270%22 text-anchor=%22middle%22 font-size=%2280%22 font-family=%22monospace%22 font-weight=%22bold%22 fill=%22%23ffff00%22 style=%22filter: drop-shadow(2px 2px 0 %23ff00ff) drop-shadow(4px 4px 0 %2300ffff)%22>W</text></svg>">
    <link rel="stylesheet" href="/css/main.css?v=6">
</head>
<body>
    <div class="container">
        <h1>Weight, What?</h1>
        <div class="subtitle">Turn boring numbers into mind-blowing comparisons!</div>
        
        <div class="examples">
            <strong>Try these examples:</strong><br>
            <span class="example-item" onclick="setWeight('75 kg')">75 kg</span>
            <span class="example-item" onclick="setWeight('25 pounds')">25 pounds</span>
            <span class="example-item" onclick="setWeight('500 grams')">500 grams</span>
            <span class="example-item" onclick="setWeight('0.5 tons')">0.5 tons</span>
            <span class="example-item" onclick="setWeight('50 kg')">50 kg</span>
        </div>
        
        <div class="input-group">
            <label for="weight">Weight Input:</label>
            <input type="text" id="weight" placeholder="e.g., 75 kg, 25 pounds, 500 grams" />
        </div>
        
        <div class="input-group">
            <label for="style">Comparison Style:</label>
            <select id="style">
                <option value="default">Default - Quick & accurate</option>
                <option value="creative">Creative - More detailed</option>
                <option value="technical">Technical - Precise</option>
            </select>
        </div>
        
        <div class="comparison-buttons">
            <button onclick="compareWeight('fast')" id="fastBtn">Compare</button>
        </div>
        
        <div id="result"></div>
        
        <div class="counter-section">
            <div class="counter-title">WEIGHTS HAVE BEEN COMPARED</div>
            <div class="counter-display">
                <span id="counter">...</span>
            </div>
            <div class="counter-subtitle">minds blown by weight wisdom</div>
        </div>
    </div>

    <script src="/js/api-client.js?v=3"></script>
    <script src="/js/app.js?v=4"></script>
</body>
</html>
