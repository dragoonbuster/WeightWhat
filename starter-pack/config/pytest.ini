[tool:pytest]
# Test discovery patterns
python_files = test_*.py *_test.py tests.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
norecursedirs = .git .venv venv env node_modules dist build *.egg .eggs .tox .cache

# Output options
addopts = 
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all tests
    -ra
    # Strict markers
    --strict-markers
    # Show warnings
    --strict-config
    # Coverage with missing lines
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    # Fail on coverage threshold
    --cov-fail-under=80
    # Show slowest tests
    --durations=10
    # Capture output
    --capture=no
    # Color output
    --color=yes
    # Parallel execution (adjust -n based on CPU cores)
    -n auto
    # Randomize test order
    --random-order
    # Fail fast
    --maxfail=1
    # Show deprecation warnings
    -W default

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    e2e: marks tests as end-to-end tests
    requires_db: marks tests that require database
    requires_redis: marks tests that require redis
    requires_api_key: marks tests that require external API keys
    asyncio: marks tests as async

# Asyncio configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = app
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*
    */migrations/*
    */alembic/*
    */config.py
    */settings.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    except ImportError:
    pass

[coverage:html]
directory = htmlcov

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
timeout = 300
timeout_method = thread

# Disable Django plugin if not using Django
django_find_project = false

# Configure test database
[tool:pytest:database]
postgresql = postgresql://test_user:test_pass@localhost:5432/test_tickertape
sqlite = sqlite:///./test_tickertape.db

# Environment variables for tests
[tool:pytest:env]
ENVIRONMENT = test
TESTING = true
DATABASE_URL = sqlite:///./test_tickertape.db
SECRET_KEY = test-secret-key
JWT_SECRET_KEY = test-jwt-secret
REDIS_URL = redis://localhost:6379/15