# SizeComparator Base Configuration
# This file contains default settings that apply across all environments

application:
  name: "SizeComparator"
  version: "1.0.0"
  description: "AI-powered weight comparison service"
  
  # API Configuration
  api:
    title: "SizeComparator API"
    version: "v1"
    description: "Convert weight inputs into relatable object comparisons"
    docs_url: "/docs"
    redoc_url: "/redoc"
    openapi_url: "/openapi.json"

  # Server Configuration
  server:
    host: "0.0.0.0"
    port: 8000
    workers: 1
    timeout: 30
    keepalive: 2

# Weight Processing Configuration
weight:
  supported_units: ["lbs", "kg", "g", "oz", "st", "mt", "ton", "mg", "μg"]
  default_unit: "lbs"
  max_weight_lbs: 1000000
  max_weight_kg: 453592
  min_weight_grams: 0.001
  precision_digits: 6
  display_precision: 2

# AI Provider Configuration
ai_providers:
  enabled: ["openai", "anthropic", "xai"]
  default_provider: "openai"
  timeout_seconds: 30
  max_retries: 3
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 60
    half_open_max_calls: 3

  # Provider-specific settings
  openai:
    model: "gpt-4"
    max_tokens: 150
    temperature: 0.7
    rate_limit_rpm: 3500
    
  anthropic:
    model: "claude-3-sonnet-20240229"
    max_tokens: 150
    temperature: 0.7
    rate_limit_rpm: 1000
    
  xai:
    model: "grok-beta"
    max_tokens: 150
    temperature: 0.7
    rate_limit_rpm: 500

# Prompt Templates
prompts:
  weight_comparison:
    system: |
      You are a weight comparison expert that helps people understand weights through familiar objects.
      Always provide exactly 2 different comparisons.
      Use common household items, animals, or everyday objects.
      Be accurate with weight relationships.
    
    user_template: |
      Convert {weight} {unit} into exactly 2 different relatable object comparisons.
      Format: "Number + Object type (individual weight)"
      Examples: "Four chickens (6 lbs each)" or "One car tire (24 lbs total)"

# Caching Configuration
cache:
  enabled: true
  ttl_seconds: 300
  max_size: 1000
  
# Logging Configuration  
logging:
  level: "INFO"
  format: "json"
  include_timestamp: true
  include_request_id: true
  
# Monitoring Configuration
monitoring:
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  
  health_checks:
    enabled: true
    interval_seconds: 30
    timeout_seconds: 5

# Security Configuration
security:
  cors:
    allow_origins: ["*"]
    allow_methods: ["GET", "POST", "OPTIONS"]
    allow_headers: ["*"]
    allow_credentials: false
  
  rate_limiting:
    enabled: true
    requests_per_minute: 100
    burst_size: 20