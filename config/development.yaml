# Development Environment Configuration
# Overrides base.yaml settings for development

application:
  server:
    workers: 1
    debug: true
    reload: true

logging:
  level: "DEBUG"
  format: "text"  # More readable for development

monitoring:
  health_checks:
    interval_seconds: 10  # More frequent in dev

security:
  cors:
    allow_origins: 
      - "http://localhost:3000"
      - "http://localhost:8080"
      - "http://127.0.0.1:3000"
      - "http://127.0.0.1:8080"
    allow_credentials: true

ai_providers:
  # More aggressive timeouts for development
  timeout_seconds: 10
  circuit_breaker:
    failure_threshold: 3  # Fail faster in dev

cache:
  ttl_seconds: 60  # Shorter cache for development