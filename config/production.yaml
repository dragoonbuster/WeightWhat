# Production Environment Configuration
# Overrides base.yaml settings for production

application:
  server:
    workers: 4
    debug: false
    reload: false
    keepalive: 5

logging:
  level: "INFO"
  format: "json"

monitoring:
  health_checks:
    interval_seconds: 30
    timeout_seconds: 10

security:
  cors:
    allow_origins: []  # Must be explicitly set via environment
    allow_credentials: true
  
  rate_limiting:
    enabled: true
    requests_per_minute: 60  # More restrictive in production
    burst_size: 10

ai_providers:
  timeout_seconds: 30
  max_retries: 3
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300  # Longer recovery in production

cache:
  ttl_seconds: 600  # Longer cache for production