version: '3.8'

services:
  sizecomparator:
    build: .
    ports:
      - "8000:8000"
      - "9090:9090"  # Metrics port
    environment:
      - SIZECOMPARATOR_ENV=production
      - SIZECOMPARATOR_LOG_LEVEL=info
      - SIZECOMPARATOR_API_HOST=0.0.0.0
      - SIZECOMPARATOR_API_PORT=8000
      - SIZECOMPARATOR_API_WORKERS=4
    env_file:
      - .env
    volumes:
      - cost_data:/app/cost_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Development service with hot reload
  sizecomparator-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      - SIZECOMPARATOR_ENVIRONMENT=development
      - SIZECOMPARATOR_DEBUG=true
      - SIZECOMPARATOR_RELOAD=true
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/venv  # Anonymous volume for virtual environment
    profiles:
      - dev

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning:ro
    profiles:
      - monitoring

volumes:
  grafana-storage:
  redis_data:
  cost_data:

networks:
  default:
    name: sizecomparator-network